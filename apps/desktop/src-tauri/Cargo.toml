[package]
name = "glasscore"
version = "0.1.0"
description = "GlassCore â€” local-first Windows desktop command centre"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "glasscore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-autostart = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
rusqlite = { version = "0.37", features = ["bundled"] }
window-vibrancy = "0.8"
parking_lot = "0.12"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
png = "0.18"
log = "0.4"
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Services",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_System_Power",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_System_EventLog",
  "Win32_System_IO",
  "Win32_System_Performance",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_WindowsProgramming",
  "Win32_System_LibraryLoader",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Devices_Properties",
  "Win32_Devices_Display",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com_StructuredStorage",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
