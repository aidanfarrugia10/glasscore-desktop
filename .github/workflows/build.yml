name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build hardware helper
        working-directory: apps/broker
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Install UI dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop app
        working-directory: apps/desktop
        run: npx tauri build

      - name: Collect unsigned artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/glasscore.exe out/
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item apps/broker/publish/glasscore-broker.exe out/

      - name: Upload unsigned build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: glasscore-unsigned
          path: out/*

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

  # Runs only for version tags once the SignPath Foundation has accepted the project.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: glasscore
          signing-policy-slug: release-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: signed/*
          generate_release_notes: true
